<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" rx="15" fill="#131211"/>
  <!-- Favicon aparece a 16px na aba: sem o anel interno e sem o texto fino
       do MoedaLogo, que viravam borrao nesse tamanho. So a moeda cheia e um
       R$ grande e grosso. Estatico (fora do React), entao usa o literal do
       tema escuro (--color-moeda-traco: #4a3208), como o resto da marca. -->
  <circle cx="32" cy="32" r="24" fill="#d9a441"/>
  <circle cx="32" cy="32" r="24" fill="none" stroke="#4a3208" stroke-width="3" opacity="0.55"/>
  <text x="32" y="43" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
        font-weight="900" font-size="30" fill="#4a3208" letter-spacing="-1.5">R$</text>
</svg>
