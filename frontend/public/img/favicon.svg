<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- A moeda R$ da marca — a mesma do cabecalho (ui/MoedaLogo.tsx), a pedido
       em 2026-08-13. Substitui o cofrinho de 12/08.

       ATENCAO A QUEM FOR MEXER: uma moeda R$ ja esteve aqui e foi RETIRADA em
       2026-07-19 por ser ilegivel a 16px (o spec daquela rodada:
       "tres circulos concentricos e um texto - detalhe demais"). Voltar ao
       desenho antigo repete o defeito. O que muda nesta versao, e por que ela
       le onde a outra nao lia:

       1. A moeda e SANGRADA (r=31 num quadro de 64). A anterior desenhava a
          face em r=23, usando so metade da area disponivel - o R$ nascia
          pequeno por construcao. Aqui a face ocupa o quadro inteiro e o texto
          cresce junto.
       2. UM anel, nao tres. Os circulos concentricos eram o "detalhe demais":
          a 16px cada anel vira uma linha cinza de meio pixel e o conjunto
          empasta. O que sobrou e discreto de proposito - vira textura a 16px
          e so aparece como detalhe a 32px+ (que e o tamanho real na aba de
          tela HiDPI).
       3. CONTRASTE INVERTIDO: face clara (#6bb3e8) com o R$ em azul quase
          preto. A versao antiga punha traco escuro sobre face escura
          (#1b5e8f), e era ai que o texto sumia. Estes sao os literais do TEMA
          ESCURO do app (os tokens `color-marca` e `color-moeda-traco` de
          index.css, com os dois tracos na frente): escolhidos por contraste,
          nao por tema - a face clara segura o glifo escuro tanto na aba clara
          quanto na escura.

       CUIDADO: comentario de XML nao aceita dois hifens seguidos. Escrever o
       nome de um token CSS aqui (com os dois tracos da frente) quebra o
       arquivo INTEIRO, e o navegador simplesmente nao mostra icone nenhum,
       sem erro de build e sem erro de teste. Ja aconteceu neste arquivo.

       Estatico, fora do React: usa literais, como o resto da marca impressa
       (og.png). Trocar o desenho pede trocar tambem o `?v=` do <link> em
       index.html e demo.html - sem isso o navegador serve o icone velho do
       cache por dias. -->
  <circle cx="32" cy="32" r="31" fill="#6bb3e8"/>
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="#06202f" stroke-width="1.8" opacity="0.35"/>

  <!-- `textLength` trava a largura em 34 unidades. Favicon roda em modo
       estatico seguro: fonte de arquivo NAO carrega, entao quem desenha o R$
       e a monoespacada do sistema - Consolas, Menlo, DejaVu, cada uma com sua
       largura. Sem o travamento, a mais larga delas encostaria no anel. -->
  <text x="32" y="42.5" text-anchor="middle" textLength="34" lengthAdjust="spacingAndGlyphs"
        font-family="ui-monospace, 'Cascadia Mono', 'Segoe UI Mono', Menlo, Consolas, monospace"
        font-weight="700" font-size="29" fill="#06202f">R$</text>
</svg>
