<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Capital Financeiro — importe faturas e extratos em PDF e veja para onde seu dinheiro foi."
    />
    <meta name="author" content="Cielio Queiroz" />
    <!-- Card de compartilhamento (WhatsApp, Telegram, Discord).
         og:image PRECISA ser URL absoluta: os servidores desses apps buscam a
         imagem de fora e não alcançam caminho relativo nem localhost. Trocar
         o domínio abaixo quando o deploy definir a URL real. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Capital Financeiro" />
    <meta property="og:title" content="Capital Financeiro — Seu extrato vira gráfico, em menos de um minuto." />
    <meta
      property="og:description"
      content="Importe faturas e extratos em PDF e enxergue seus gastos por categoria, dia, mês e ano."
    />
    <meta property="og:url" content="https://capital-financeiro.vercel.app/" />
    <meta property="og:image" content="https://capital-financeiro.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Capital Financeiro — seu extrato vira gráfico, em menos de um minuto." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Capital Financeiro — Seu extrato vira gráfico, em menos de um minuto." />
    <meta
      name="twitter:description"
      content="Importe faturas e extratos em PDF e enxergue seus gastos por categoria, dia, mês e ano."
    />
    <meta name="twitter:image" content="https://capital-financeiro.vercel.app/og.png" />
    <!-- O `?v=` é o que faz o ícone novo aparecer. Favicon é dos recursos mais
         agressivamente cacheados que existe: o navegador continua servindo o
         desenho antigo por dias mesmo com deploy novo, e trocar o conteúdo do
         arquivo não adianta porque a URL é a mesma. Mudou o desenho, muda o
         token aqui e em demo.html. -->
    <link rel="icon" href="/img/favicon.svg?v=moeda" type="image/svg+xml" />
    <!-- As fontes agora vêm do próprio domínio (src/fontes.css +
         public/fonts). O Google Fonts saiu daqui para que a CSP possa ser
         `font-src 'self'`: foi a quebra das fontes que fez a política
         completa ficar de fora em 2026-07-29. -->
    <link rel="preload" href="/fonts/ibm-plex-sans-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-mono-500-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Capital Financeiro</title>
    <!-- Tema ANTES da primeira pintura. O React só estampa data-theme depois
         de montar; sem isto a página nasce com o padrão do CSS (escuro) e
         pisca para o claro. Mesma regra do ThemeToggle: escolha salva >
         preferência do sistema > claro. Se duplicar a regra aqui incomodar,
         o jeito é o CSS nascer claro — não tirar este bloco. -->
    <script>
      (function () {
        try {
          var salvo = localStorage.getItem('tema')
          var tema =
            salvo === 'light' || salvo === 'dark'
              ? salvo
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = tema
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
