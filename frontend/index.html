<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Capital Financeiro — importe faturas e extratos em PDF e veja para onde seu dinheiro foi."
    />
    <meta name="author" content="Cielio Queiroz" />
    <!-- Card de compartilhamento (WhatsApp, Telegram, Discord).
         og:image PRECISA ser URL absoluta: os servidores desses apps buscam a
         imagem de fora e não alcançam caminho relativo nem localhost. Trocar
         o domínio abaixo quando o deploy definir a URL real.

         ⚠️ O `?v=` NÃO é enfeite. WhatsApp, Telegram e as redes guardam o
         card por semanas: publicar um og.png novo na MESMA URL não muda o
         que aparece quando alguém compartilha. Trocar o sufixo é o que força
         a rebusca — mesma razão do `?v=moeda` no favicon. Mudou a imagem,
         muda o sufixo. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Capital Financeiro" />
    <meta property="og:title" content="Capital Financeiro — Seu extrato vira gráfico, em menos de um minuto." />
    <meta
      property="og:description"
      content="Importe faturas e extratos em PDF e enxergue seus gastos por categoria, dia, mês e ano."
    />
    <meta property="og:url" content="https://capital-financeiro.vercel.app/" />
    <meta property="og:image" content="https://capital-financeiro.vercel.app/og.png?v=carimbo" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Capital Financeiro — seu extrato vira gráfico, em menos de um minuto." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Capital Financeiro — Seu extrato vira gráfico, em menos de um minuto." />
    <meta
      name="twitter:description"
      content="Importe faturas e extratos em PDF e enxergue seus gastos por categoria, dia, mês e ano."
    />
    <meta name="twitter:image" content="https://capital-financeiro.vercel.app/og.png?v=carimbo" />
    <!-- O `?v=` é o que faz o ícone novo aparecer. Favicon é dos recursos mais
         agressivamente cacheados que existe: o navegador continua servindo o
         desenho antigo por dias mesmo com deploy novo, e trocar o conteúdo do
         arquivo não adianta porque a URL é a mesma. Mudou o desenho, muda o
         token aqui e em demo.html. -->
    <link rel="icon" href="/img/favicon.svg?v=moeda" type="image/svg+xml" />
    <!-- As fontes agora vêm do próprio domínio (src/fontes.css +
         public/fonts). O Google Fonts saiu daqui para que a CSP possa ser
         `font-src 'self'`: foi a quebra das fontes que fez a política
         completa ficar de fora em 2026-07-29. -->
    <link rel="preload" href="/fonts/ibm-plex-sans-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-mono-500-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Capital Financeiro</title>
    <!-- Tema ANTES da primeira pintura. O React só estampa data-theme depois
         de montar; sem isto a página nasce com o padrão do CSS e pisca ao
         montar. Mesma regra do ThemeToggle: escolha salva > **escuro**.

         O sistema NÃO opina mais. A regra era "escolha salva > preferência do
         sistema > claro", e o efeito prático dela apareceu em 2026-09-04, num
         celular: aparelho no modo claro, e o app — que é escuro em toda
         comunicação e em todo print — abrindo branco para quem nunca tinha
         entrado. Herdar a preferência do sistema é bom para um site de texto;
         para um produto com identidade escura, é abrir diferente do que se
         mostrou. Quem quiser claro tem o botão, e a escolha fica salva.

         ⚠️ Mexeu neste bloco? O hash da CSP em `vercel.json` muda junto —
         ele é sha256 do texto ENTRE as tags, em LF. Sem isso o script é
         bloqueado EM PRODUÇÃO e a página nasce sem tema. -->
    <script>
      (function () {
        try {
          var salvo = localStorage.getItem('tema')
          document.documentElement.dataset.theme = salvo === 'light' ? 'light' : 'dark'
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
