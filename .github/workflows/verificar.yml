# A rede que faltava entre um commit e a produção.
#
# `AGENTS.md` §5: "Push na `main` publica. Não existe ambiente de homologação:
# verificar antes é a única rede." Até 2026-09-06 essa rede era a memória de
# quem commitava — não havia CI nenhum no repositório, e `npm run verificar`
# só rodava se alguém lembrasse.
#
# Aqui roda a MESMA verificação da máquina do dono (`scripts/verificar.py`),
# na mesma ordem, para não existirem duas definições de "está pronto".
#
# Desde 2026-09-08 rodam também os dois medidores que o `verificar` não faz — o
# do motor de PDF e o do login. Eles ficam fora do `verificar` porque cada um
# precisa de um build com `VITE_*` próprias, mas ficar fora do `verificar` não
# é motivo para ficar fora do CI: medidor que só roda quando alguém lembra é
# medidor que não vigia nada.

name: verificar

on:
  push:
    branches: [main]
  pull_request:
  # A auditoria de dependência precisa rodar sozinha: vulnerabilidade nova
  # aparece sem ninguém commitar nada.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

# Um push novo cancela a verificação do anterior: a `main` publica sozinha, e
# medir um commit já superado não serve para nada.
concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: uv (o verificar.py roda por ele)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # `medir-csp.py` sobe o `dist/` com os headers do vercel.json e mede a
      # CSP num navegador de verdade — sem isto o passo de CSP não roda.
      - name: navegador do Playwright
        run: uv run --with playwright python -m playwright install --with-deps chromium

      # typecheck · testes · lint · caminhos · build · CSP, nesta ordem.
      # A ordem não é opcional: `npm test` não checa tipos, e `medir-csp.py`
      # mede o dist/, então precisa do build antes.
      - name: verificação completa
        run: npm run verificar

  # Os dois medidores que o `verificar` NAO faz, e que por isso so rodavam se
  # alguem lembrasse. Cada um precisa de um build proprio, com `VITE_*`
  # diferentes — e e por isso que ficam fora do `verificar` e num job aparte,
  # em paralelo com ele.
  #
  # Eles cobrem exatamente o que a suite nao alcanca: os 9 fixtures sao JSON ja
  # extraido e `load.ts` e mockado no jsdom, entao a suite fica verde com o
  # motor de PDF quebrado; e o `@neondatabase/neon-js` e mockado inteiro, entao
  # ela fica verde com o login quebrado.
  medidores:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: navegador do Playwright
        run: uv run --with playwright python -m playwright install --with-deps chromium

      # ⚠️ Os dois medem o `dist/`, e um build que falha deixa o `dist`
      # ANTERIOR no lugar — verde contra o build errado. Por isso cada build e
      # um passo proprio: falhando, o job para antes de medir.
      - name: build do modo "importa e ve"
        run: npm run build:semlogin

      - name: o motor de PDF abre arquivo (4 pisos de navegador)
        run: npm run medir:pdf

      - name: build do modo de login
        run: npm run build:login

      - name: o login funciona (5 cenarios, contra um Auth de mentira)
        run: npm run medir:login

  seguranca:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # O gitleaks precisa do histórico para varrer commits, não só a
          # árvore atual: segredo commitado e depois removido continua lá.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # O ADR-0011 já usou isto como critério de decisão: `@vercel/node` foi
      # descartado, entre outros motivos, por trazer 5 vulnerabilidades.
      - name: npm audit
        run: npm audit --audit-level=high

      # O repositório tem regra explícita de nunca commitar PDF real (CPF,
      # agência, conta, nomes de terceiros) e de manter `.env.*` fora do git.
      # Regra que ninguém mede é regra que já foi quebrada.
      - name: gitleaks
        run: |
          VERSAO=8.28.0
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/gitleaks_${VERSAO}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --verbose --exit-code 1
